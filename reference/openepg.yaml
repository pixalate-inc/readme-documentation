openapi: 3.0.3
info:
  title: OpenEPG Enrichment API
  version: 1.0.0-draft.2
  description: >
    This description is DERIVED from the OpenEPG Enrichment Service
    specification

    (docs/confluence/Specification/ in the epg-enrichment-api repository), which
    is authoritative for all

    behavior. This document owns schema-level detail — full schemas, examples,
    and status codes —

    that the specification does not descend to. Where the two disagree on
    behavior, the

    specification is correct and this document has a defect.


    Resolves CTV ad opportunities to the channel and program being watched,
    returning show

    metadata as an OpenRTB 2.6 Content object with a confidence score. Misses
    are structured

    HTTP 200 responses; HTTP errors are reserved for malformed requests,
    authentication,

    rate limiting, and infrastructure failure (fail-closed 503).


    ## Two routes


    | Route | Endpoint | Shape | For |

    | --- | --- | --- | --- |

    | **OpenRTB passthrough** | `POST /enrich` (+ `/enrich/batch`) | Send an
    OpenRTB 2.6 bid request, get the same bid request back with `app.content`
    enriched in place. Diagnostics travel in response headers, never in the
    body. | SSPs splicing content identity into outbound bid requests in real
    time. |

    | **Parameterized lookup** | `POST /lookup` (+ `/lookup/batch`) | Send a
    flat JSON object of named identifier parameters, get a diagnostic envelope
    with the best match, its confidence, and reason codes. | DSPs, analytics and
    measurement, impression-log enrichment, and integration debugging. |


    ## Precision ladder — what your inputs buy you


    Resolution quality is a function of the identity signal you pass. A bid
    request that

    carries the needed values resolves with higher precision, and on the
    parameterized

    lookup every additional identifier parameter you provide increases the
    precision of the

    results. Three input cases define the ladder:


    | Input case | You send | Outcome |

    | --- | --- | --- |

    | App only | `bundle` | Full resolution for single-channel apps. For
    aggregator apps, a structured miss (`CHANNEL_UNRESOLVED`) rather than a
    guess. |

    | App + channel identifier | + channel id or channel name | Per-impression
    channel resolution, then a schedule join to the program airing at the lookup
    time. |

    | App + show identifier | + show title | Direct program resolution; a show
    always carries its channel association. |


    The more identifier signal your supply passes, the larger the share of
    impressions that

    resolves beyond the app shell. Channel identifiers decide how far aggregator
    traffic

    gets — measure their presence per app, not just overall, because a handful
    of

    high-volume apps usually dominate the answer.


    ## Catalog scope


    | | |

    | --- | --- |

    | **Content type** | Linear EPG (channel and schedule) content only. |

    | **Geography** | The catalog is US-focused. There is no geo parameter and
    geo from the bid request is not read — know the geo mix of the traffic you
    plan to enrich. |

    | **Language** | Predominantly English; non-English identifiers match
    best-effort. |

    | **Time window** | Any instant from 7 days ago through now. An absent
    timestamp means now. |

    | **App scoping** | Resolution is scoped to the declared app. A channel
    carried by a different app is never substituted, at any confidence. |


    ## Input handling


    - A required read field missing or empty → 400. An optional read field
    malformed →
      treated as absent. A read field of the wrong type → 400.
    - Unknown fields are ignored. On the passthrough route, OpenRTB's own
    required fields
      (`id`, `imp`) are not enforced — a lookup-only body may omit them.
    - Channel id strictly supersedes channel name: when the id is present the
    name is not
      consulted (visible only in verbose debug on the lookup route).
    - When the channel path and the show path disagree, the channel + timestamp
    result wins;
      the show input is marked `CONFLICT` in verbose debug.
    - Timestamps up to 5 minutes in the future are clamped to now
    (`TIMESTAMP_CLAMPED`
      notice); further in the future, older than the 7-day window, or unparseable → 400.
    - Unicode is accepted with normalization. Fuzzy-matched fields (channel
    name, title) are
      capped at 256 characters; longer values are truncated.

    ## Service levels


    Design targets, confirmed under load before beta traffic:


    | Metric | Target |

    | --- | --- |

    | Latency, server-side (both routes) | Real-time (timestamp absent or within
    5 minutes of now): p50 ≤ 10 ms, p99 ≤ 25 ms. Historical timestamps: p99 ≤
    250 ms. |

    | Throughput | Horizontally scalable. |

    | Batch | No latency SLA; batch traffic never degrades the real-time
    targets. |

    | Availability | 99.9% monthly excluding scheduled maintenance (GA target);
    the beta sandbox runs on internal targets without a contractual availability
    SLA. |

    | Degradation | Fail closed: 503 with `Retry-After`, never a false miss. |


    ## Getting to production


    - **Authentication** — headers only, on every route: your Pixalate API key
    in the
      `x-api-key` header, or username/password via `Authorization: Basic`. Credentials are
      never accepted in query parameters.
    - **Sandbox** — a non-billing sandbox environment is available for
    integration testing;
      sandbox requests are never charged.
    - **Go-live** — integrations validate against a published checklist of
    required test
      scenarios before carrying production traffic.
    - **Versioning** — the major version is in the URL path; additive changes
    are
      non-breaking within a major version.

    ## Draft status


    Field semantics and shapes are ratified, the route paths, batch item caps,
    diagnostic

    response-header names, lookup field names and `os` vocabulary among them. A

    timestamp supplied to the passthrough route is honored, so a request is
    never

    answered against an instant other than the one it asked for — an instant
    outside

    the servable window is a 400, never a silent substitution of now.


    During the beta, `content.id` and `content.channel.id` values are
    provisional

    identifiers with no stability promise; a stable public identifier scheme
    with a stated

    guarantee arrives at GA.
  contact:
    name: Pixalate, Inc.
    url: https://www.pixalate.com
    email: support@pixalate.com
  x-logo:
    url: >-
      https://cdn.pixalate.com/app-navigation/assets/images/pixalate-logo-red.svg
    backgroundColor: '#FFFFFF'
    altText: Pixalate, Inc.
servers:
  - url: https://epg-api.pixalate.com/v1
    description: Production.
  - url: https://dev-epg-api.pixalate.com/v1
    description: Development sandbox.
security:
  - ApiKey: []
  - BasicAuth: []
tags:
  - name: OpenRTB Passthrough
    description: >-
      Send an OpenRTB 2.6 bid request; receive the same bid request with
      `app.content` enriched in place. The response body is always pure OpenRTB
      — diagnostics travel in response headers.
  - name: Parameterized Lookup
    description: >-
      Send named identifier parameters; receive the best match with confidence,
      reason codes, and diagnostics. Each additional identifier parameter
      increases the precision of the results.
paths:
  /enrich:
    post:
      operationId: enrich
      summary: Enrich one OpenRTB bid request in place
      tags:
        - OpenRTB Passthrough
      description: >
        The SSP splice path. The body is a standard OpenRTB 2.6 bid request;
        only the

        documented input fields are read and everything else is preserved. On a
        hit, the

        response is the same bid request with the program-identity fields of
        `app.content`

        — `id`, `title`, `series`, `episode`, `season`, `genre`, `cat`, `len`,
        `channel`,

        `livestream`, `contentrating`, `language` — replaced atomically by the
        single best

        candidate: each is set to the resolved value or removed when resolved as
        absent, so

        no stale program facts from the request survive next to the resolution.

        Identity-neutral `app.content` fields and everything outside
        `app.content` are

        preserved untouched, and `app.content.ext.openepg.attribution` is set.
        `season`

        and `cat` belong to the replaced cluster but are never populated in v1,
        so a hit

        always removes them. Preservation is in meaning, not bytes:
        re-serialization may

        change encoding (key order, number formatting), never values — detect
        misses by

        reading the `X-OpenEPG-Outcome` header, not by byte-comparing bodies.


        On a miss — and on a degraded resolution where the channel resolved but
        nothing

        airs at the lookup instant — the bid request comes back **unchanged**,
        HTTP 200.

        A channel-only splice next to foreign program fields is never produced.


        Nothing is ever added to the body: no confidence, reason, notices, or
        debug —

        anything in this body must be assumed to enter the bidstream. The
        outcome and the

        confidence of the chosen candidate travel in `X-OpenEPG-*` response
        headers.


        Exactly one candidate is used, always; there are no query parameters on
        this route.

        Passing a bid request that carries the needed identifier values (channel
        id,

        channel name, or show title) raises the precision of the enrichment — an
        app-only

        request on an aggregator app is a structured miss, never a guess. A
        supplied

        `ext.pixalate.timestamp` is honored on this route and on its batch
        variant: the

        resolution joins the schedule at that instant instead of at now, under
        the same

        window and clamping rules the lookup route applies. An instant outside
        the

        servable window is a 400 carrying `TIMESTAMP_OUT_OF_WINDOW`, never a
        silent

        substitution of now.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenRtbBidRequest'
            examples:
              channelIdentifierCarried:
                summary: Aggregator app with a channel identifier
                value:
                  app:
                    bundle: com.pluto.tv
                    content:
                      channel:
                        id: espn
                  device:
                    ua: Roku/DVP-13.0.0
      responses:
        '200':
          description: >
            Enrichment performed. On a hit, the echoed bid request carries the
            resolved

            program in `app.content`; on a miss or a degraded resolution, the
            bid request

            is returned unchanged. Read the `X-OpenEPG-Outcome` header to
            distinguish the

            two without diffing the body.
          headers:
            X-OpenEPG-Outcome:
              description: >-
                `HIT` on a hit, or the miss reason code (APP_UNRESOLVED,
                OUT_OF_SCOPE, NO_COVERAGE, CHANNEL_UNRESOLVED, SHOW_UNRESOLVED).
              schema:
                type: string
            X-OpenEPG-Confidence:
              description: Confidence of the spliced candidate, on a hit.
              schema:
                type: string
            X-OpenEPG-Notices:
              description: Response-semantics notices, when any.
              schema:
                type: string
            X-OpenEPG-Request-Id:
              description: Request identifier echo, for support correlation.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenRtbBidRequest'
              examples:
                hit:
                  summary: 'Hit: app.content replaced with the resolved program'
                  value:
                    app:
                      bundle: com.pluto.tv
                      content:
                        id: ec-4Fq0X2
                        title: SportsCenter
                        genre: Sports
                        contentrating: TV-PG
                        channel:
                          id: eg-Tj5r8w
                          name: ESPN
                        ext:
                          openepg:
                            attribution: pixalate-openepg/v1
                    device:
                      ua: Roku/DVP-13.0.0
                miss:
                  summary: 'Miss: bid request returned unchanged'
                  value:
                    app:
                      bundle: com.pluto.tv
                      content:
                        channel:
                          id: espn
                    device:
                      ua: Roku/DVP-13.0.0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLargeBody'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /enrich/batch:
    post:
      operationId: enrichBatch
      summary: Enrich many OpenRTB bid requests in one call
      tags:
        - OpenRTB Passthrough
      description: >
        An array of OpenRTB 2.6 bid requests in; an array of passthrough
        responses out,

        same order, one-to-one. An invalid item occupies its slot with the
        `{code,

        message}` error object its single-request 400 would have carried — the
        one

        sanctioned non-OpenRTB element in this route's 2xx responses — while
        valid items

        resolve normally. Exceeding the documented item cap fails the whole
        batch with

        400. Each item counts as one unit against your rate limit and your
        usage. No

        query parameters; no latency SLA on batch. Per-item diagnostic signaling
        on this route

        is provisional — a batch caller that needs a per-item outcome,
        confidence, or

        reason should use the parameterized lookup batch, whose envelope carries
        them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/OpenRtbBidRequest'
              maxItems: 100
      responses:
        '200':
          description: >-
            Batch processed; inspect each slot for the per-item outcome — an
            enriched or unchanged bid request, or an error object for an invalid
            item.
          content:
            application/json:
              schema:
                type: array
                items:
                  anyOf:
                    - $ref: '#/components/schemas/OpenRtbBidRequest'
                    - $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /lookup:
    post:
      operationId: lookup
      summary: Resolve named identifiers to the best-matching program
      tags:
        - Parameterized Lookup
      description: >
        The flat REST path: one JSON object of named identifier parameters in, a

        diagnostic envelope out. **Each additional identifier parameter you
        provide

        increases the precision of the results**: `bundle` alone fully resolves

        single-channel apps but returns a structured miss on aggregator apps;
        adding

        `channelId` or `channelName` resolves the channel and joins the schedule
        at the

        lookup instant; adding `title` resolves the program directly. One

        uniform response shape covers every outcome — parts are populated or
        empty, never

        reshaped.


        Unlike the passthrough route, this route returns confidence and
        per-candidate

        diagnostics in the body — use it for impression-log enrichment, DSP-side
        lookups,

        and integration debugging. Both routes honor a supplied instant; this
        one reads it

        from the flat `timestamp` field below. Pass `verbose: true` during
        integration

        against an environment that offers the debug object: it shows exactly
        how each

        input was read. The sandbox at `dev-epg-api.pixalate.com` offers it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupRequest'
            examples:
              appOnlyAggregator:
                summary: App only, on an aggregator app
                value:
                  bundle: com.pluto.tv
              withChannelIdentifier:
                summary: Same app plus a channel identifier
                value:
                  bundle: com.pluto.tv
                  channelId: espn
                  os: roku
      responses:
        '200':
          description: Lookup performed (hit or structured miss).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupResponse'
              examples:
                appOnlyAggregatorMiss:
                  summary: 'App only on an aggregator: structured miss, never a guess'
                  value:
                    reason: CHANNEL_UNRESOLVED
                    notices: []
                    candidates: []
                withChannelIdentifierHit:
                  summary: 'With a channel identifier: deterministic hit'
                  value:
                    notices: []
                    candidates:
                      - content:
                          id: ec-4Fq0X2
                          title: SportsCenter
                          genre: Sports
                          contentrating: TV-PG
                          channel:
                            id: eg-Tj5r8w
                            name: ESPN
                          ext:
                            openepg:
                              attribution: pixalate-openepg/v1
                        confidence: 1
        '400':
          $ref: '#/components/responses/BadRequestLookup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLargeBody'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /lookup/batch:
    post:
      operationId: lookupBatch
      summary: Resolve many lookups in one call
      tags:
        - Parameterized Lookup
      description: >
        An array of lookup requests in; an array of lookup responses out, same
        order,

        one-to-one. Each item carries its own `timestamp`, so an impression log
        enriches

        against the schedule as of each impression, and its own `verbose`. An
        invalid

        item gets an `error` entry in its slot while the other items resolve
        normally.

        Exceeding the documented item cap fails the whole batch with 400. Each
        item counts

        as one unit against your rate limit and your usage. No latency SLA on
        batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/LookupRequest'
              maxItems: 100
            examples:
              impressionLog:
                summary: Two impressions, one invalid
                value:
                  - bundle: com.pluto.tv
                    channelId: espn
                    timestamp: '2026-08-28T18:30:00Z'
                  - bundle: ''
                    channelId: espn
      responses:
        '200':
          description: Batch processed; inspect each slot for the per-item outcome.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LookupResponse'
              examples:
                impressionLog:
                  summary: Per-slot outcomes, including one error entry
                  value:
                    - notices: []
                      candidates:
                        - content:
                            id: ec-4Fq0X2
                            title: SportsCenter
                            genre: Sports
                            contentrating: TV-PG
                            channel:
                              id: eg-Tj5r8w
                              name: ESPN
                            ext:
                              openepg:
                                attribution: pixalate-openepg/v1
                          confidence: 1
                    - notices: []
                      candidates: []
                      error:
                        code: BAD_REQUEST
                        message: bundle is required.
        '400':
          $ref: '#/components/responses/BadRequestLookup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      name: x-api-key
      in: header
      description: >-
        Your Pixalate-provided API key, in the request header on every route.
        Credentials are never accepted in query parameters. An API key may be
        obtained by signing up for an account on the [Pixalate developer
        website](https://developer.pixalate.com).
    BasicAuth:
      type: http
      scheme: basic
      description: >-
        Username/password alternative to the API-key header. Headers only —
        credentials are never accepted in query parameters.
  responses:
    BadRequest:
      description: >-
        Malformed request — a non-conforming body, a missing or empty required
        field, a read field of the wrong type, a timestamp violation
        (unparseable, more than 5 minutes in the future, or older than the 7-day
        window), a non-null `ext.pixalate` that is not itself an object, or an
        exceeded batch cap.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequestLookup:
      description: >-
        Malformed request — a non-conforming body, a missing or empty required
        field, a read field of the wrong type, a timestamp violation
        (unparseable, more than 5 minutes in the future, or older than the 7-day
        window), an out-of-vocabulary `os`, or an exceeded batch cap.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: >-
        The batch body exceeded the maximum number of bytes the route reads. The
        item cap bounds how many items a batch may carry; this bounds how large
        those items may be in total, and the two are enforced independently.
        Split the batch and retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLargeBody:
      description: >-
        The request body exceeded the maximum number of bytes this route
        accepts. Applies to the single (non-batch) operations; well below what a
        real payload from this route ever produces, so it signals a malformed or
        abusive request rather than an ordinary large one.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or unknown credential.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Known credential without entitlement to this product.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Rate limit exceeded. `Retry-After` says when the window clears.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: >-
        Serving infrastructure degraded — the API fails closed and never
        masquerades as a data miss. Retry after the indicated delay.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    OpenRtbBidRequest:
      type: object
      description: >
        A standard OpenRTB 2.6 bid request. The service reads only the input
        subset below,

        from their canonical OpenRTB paths, and validates those read fields
        strictly (a

        required read field missing or empty, or any read field of the wrong
        type → 400; a

        malformed optional read field is treated as absent); all other fields
        are permitted,

        ignored, and preserved in the response. OpenRTB's own required fields
        (`id`, `imp`)

        are not enforced — a lookup-only body may omit them.
      additionalProperties: true
      required:
        - app
        - device
      properties:
        app:
          type: object
          required:
            - bundle
          properties:
            bundle:
              type: string
              description: >-
                Required. App store bundle/ID. Alone it fully resolves
                single-channel apps; on an aggregator (multi-channel) app with
                no channel or show identifier alongside it, the result is a
                structured CHANNEL_UNRESOLVED miss, never a guess.
              example: com.pluto.tv
            content:
              type: object
              properties:
                title:
                  type: string
                  description: >-
                    Show/program title. Fuzzy match, scoped to the declared
                    app's catalog; a resolved show always carries its channel
                    association. When the channel path and the show path
                    disagree, the channel + timestamp result wins and this input
                    is marked CONFLICT in verbose debug (on the lookup route).
                    Capped at 256 characters; longer values are truncated.
                  example: SportsCenter
                channel:
                  type: object
                  properties:
                    id:
                      type: string
                      description: >-
                        Native/platform channel identifier, matched exactly
                        against known identifiers (substring containment as a
                        fallback). Strictly supersedes channel.name — when
                        present, the name is not consulted.
                      example: espn
                    name:
                      type: string
                      description: >-
                        Channel display name (fuzzy name match). Consulted only
                        when channel.id is absent. Capped at 256 characters;
                        longer values are truncated.
                      example: ESPN
        device:
          type: object
          required:
            - ua
          properties:
            ua:
              type: string
              description: >-
                Required. Client User-Agent; the platform/OS signal is derived
                from it when device.os gives no signal.
              example: Roku/DVP-13.0.0
            os:
              type: string
              description: >-
                Explicit OS; overrides the UA-derived value. Unrecognized values
                yield no OS signal (all-platform weighting) rather than an error
                — unlike the parameterized lookup route, where an
                out-of-vocabulary os is rejected.
              example: Roku OS
            devicetype:
              type: integer
              description: >-
                Optional OpenRTB device type. Accepted and retained for forward
                compatibility; not consulted by resolution during the beta.
              example: 3
        ext:
          type: object
          properties:
            pixalate:
              type: object
              properties:
                timestamp:
                  type: string
                  format: date-time
                  description: >-
                    ISO 8601 UTC instant to resolve against. Absent means now.
                    Up to 5 minutes in the future is clamped to now with a
                    `TIMESTAMP_CLAMPED` notice; older than 7 days, or further
                    ahead than the clamp, is a 400 carrying
                    `TIMESTAMP_OUT_OF_WINDOW`. The lookup route reads the same
                    instant from its own flat `timestamp` field.
                  example: '2026-08-28T18:30:00Z'
    LookupRequest:
      type: object
      required:
        - bundle
      description: >
        One flat lookup: the identifier parameters as named fields plus the
        processing

        controls. Each additional identifier parameter increases the precision
        of the

        results. There is no user-agent field on this route — platform signal
        arrives as

        the explicit `os` value.
      properties:
        bundle:
          type: string
          description: >-
            Required. App store bundle/ID. Alone it fully resolves
            single-channel apps; on an aggregator (multi-channel) app with no
            channel or show identifier alongside it, the result is a structured
            CHANNEL_UNRESOLVED miss, never a guess.
          example: com.pluto.tv
        channelId:
          type: string
          description: >-
            Native/platform channel identifier, matched exactly against known
            identifiers (substring containment as a fallback). Strictly
            supersedes channelName — when present, the name is not consulted.
          example: espn
        channelName:
          type: string
          description: >-
            Channel display name (fuzzy name match). Consulted only when
            channelId is absent. Capped at 256 characters; longer values are
            truncated.
          example: ESPN
        title:
          type: string
          description: >-
            Show/program title. Fuzzy match, scoped to the declared app's
            catalog; a resolved show always carries its channel association.
            When the channel path and the show path disagree, the channel +
            timestamp result wins and this input is marked CONFLICT in verbose
            debug. Capped at 256 characters; longer values are truncated.
          example: SportsCenter
        os:
          type: string
          description: >-
            Platform/OS, from a fixed enumerated vocabulary. An
            out-of-vocabulary value, including a different letter case, → 400 —
            never silently degraded. Omit the field for a platform not listed;
            resolution then runs against all platforms.
          enum:
            - roku
            - fireos
            - android
            - samsung
            - webos
            - tvos
          example: roku
        devicetype:
          type: integer
          description: >-
            Optional OpenRTB device type. Accepted and retained for forward
            compatibility; not consulted by resolution during the beta.
          example: 3
        timestamp:
          type: string
          format: date-time
          description: >-
            ISO 8601 UTC lookup instant; absent means now. Per item in batch, so
            an impression log enriches against the schedule as of each
            impression. Up to 5 minutes in the future clamps to now
            (TIMESTAMP_CLAMPED notice); further in the future, older than the
            7-day window, or unparseable → 400.
          example: '2026-08-28T18:30:00Z'
        verbose:
          type: boolean
          default: false
          description: >-
            Ask for the debug object in the response. Whether the request is
            answered with one is a property of the environment: an environment
            that does not offer the debug object returns the ordinary envelope
            without it, and with nothing on the wire to say so. The sandbox at
            `dev-epg-api.pixalate.com` offers it.
          example: true
    LookupResponse:
      type: object
      required:
        - candidates
        - notices
      description: >-
        One uniform envelope for every outcome — parts are populated or empty,
        never reshaped. A miss is a successful lookup that found nothing: HTTP
        200, empty candidates, and a single-valued reason naming the earliest
        stage that failed.
      properties:
        reason:
          $ref: '#/components/schemas/Reason'
        notices:
          type: array
          items:
            $ref: '#/components/schemas/Notice'
        candidates:
          type: array
          description: The best match on a hit; empty on a miss.
          items:
            $ref: '#/components/schemas/ContentCandidate'
        debug:
          $ref: '#/components/schemas/Debug'
        error:
          allOf:
            - $ref: '#/components/schemas/Error'
          description: >-
            Batch only — populated in a slot whose item was invalid (echoes what
            the single-request 400 would have said).
    ContentCandidate:
      type: object
      required:
        - content
        - confidence
      properties:
        content:
          $ref: '#/components/schemas/Content'
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: >-
            How sure the service is of this candidate, and the whole of what the
            service says about the strength of a match. There is no confidence
            floor — weak matches return with honestly low scores, and you choose
            the threshold that fits your use case. Airings are judged on the
            [start, stop) interval; a timestamp exactly at a boundary does not
            reduce confidence.
          example: 0.82
        candidateReason:
          type: string
          enum:
            - SCHEDULE_GAP
          description: >-
            Candidate-level degradation — the channel resolved but nothing airs
            at the lookup instant; content carries channel identity only. The
            response-level reason reads NO_COVERAGE alongside.
    Content:
      type: object
      description: >-
        OpenRTB 2.6 Content object — the splice boundary. What an SSP forwards
        downstream is exactly this object; confidence, reasons, and notices live
        outside it and never enter the bidstream unless you put them there.
        Fields are populated when known; absent means absent — the API never
        explains missing metadata. Additional OpenRTB fields permitted.
        Validated against the OpenRTB 2.6 Content definition (§3.2.16) before
        serialization.
      additionalProperties: true
      properties:
        id:
          type: string
          description: >-
            OpenEPG content ID for the resolved program. Provisional during the
            beta, with no stability promise; a stable public identifier scheme
            arrives at GA.
          example: ec-4Fq0X2
        title:
          type: string
          description: Program title, in display form.
          example: SportsCenter
        series:
          type: string
          description: Guide-provided series name (not an OpenEPG entity ID).
          example: SportsCenter
        episode:
          type: integer
          example: 214
        season:
          type: string
          description: >-
            OpenRTB season. Part of the program-identity cluster a passthrough
            hit replaces, and never populated during the beta, so a hit always
            removes it from the request.
        cat:
          type: array
          items:
            type: string
          description: >-
            OpenRTB content categories. Part of the program-identity cluster a
            passthrough hit replaces, and never populated during the beta, so a
            hit always removes it from the request.
        genre:
          type: string
          description: Genre string, conformant to the TMDB genre taxonomy.
          example: Sports
        contentrating:
          type: string
          description: Content rating (e.g. TV-PG).
          example: TV-PG
        livestream:
          type: integer
          enum:
            - 0
            - 1
          description: Live flag.
          example: 1
        len:
          type: integer
          description: Duration in seconds.
          example: 1800
        language:
          type: string
          example: en
        userrating:
          type: string
          description: >-
            OpenRTB user rating. Identity-neutral: never set by resolution, and
            preserved from the request on the passthrough route.
        prodq:
          type: integer
          description: >-
            OpenRTB production quality. Identity-neutral: never set by
            resolution, and preserved from the request on the passthrough route.
        channel:
          type: object
          properties:
            id:
              type: string
              description: >-
                OpenEPG channel ID. Provisional during the beta, with no
                stability promise; a stable public identifier scheme arrives at
                GA.
              example: eg-Tj5r8w
            name:
              type: string
              description: >-
                Channel display name (e.g. "ESPN", not a normalized matching
                form).
              example: ESPN
        ext:
          type: object
          description: >-
            The only non-2.6 data inside content — carries only what should
            travel downstream. Confidence, reasons, and notices deliberately
            live OUTSIDE this object.
          properties:
            openepg:
              type: object
              properties:
                attribution:
                  type: string
                  description: Vendor attribution.
                  example: pixalate-openepg/v1
    Reason:
      type: string
      description: >
        Present when candidates is empty or degraded. Single-valued — the
        earliest

        resolution stage that failed; a stage that never ran doesn't count.
        Finer-grained

        internal subcategories are never serialized in any response.


        | Value | Meaning | What to do |

        | --- | --- | --- |

        | `APP_UNRESOLVED` | The bundle did not resolve to a supported app. |
        Confirm the bundle is a CTV app in scope. |

        | `OUT_OF_SCOPE` | The app resolved and is not an EPG app — enrichment
        does not apply to it (e.g. a game). | Nothing — enrichment is not
        applicable. |

        | `NO_COVERAGE` | The app resolved and is an EPG app, but the EPG data
        needed to answer is not held — no lineup for it, or no schedule covering
        the instant. | Treat the impression as unenriched. Not billable. |

        | `CHANNEL_UNRESOLVED` | Channel-bearing inputs produced no channel on
        this app — including an app-only request on an aggregator app. | Check
        the identifier is correct and belongs to the declared app; pass a
        channel id or name on aggregator traffic. |

        | `SHOW_UNRESOLVED` | The show input produced no content on this app. |
        Check the title; pass a channel identifier alongside it. |
      enum:
        - APP_UNRESOLVED
        - OUT_OF_SCOPE
        - NO_COVERAGE
        - CHANNEL_UNRESOLVED
        - SHOW_UNRESOLVED
      example: CHANNEL_UNRESOLVED
    Notice:
      type: string
      description: >-
        Always-on, restricted to response-semantics changes: TIMESTAMP_CLAMPED,
        a near-future timestamp clamped to now.
      enum:
        - TIMESTAMP_CLAMPED
      example: TIMESTAMP_CLAMPED
    Debug:
      type: object
      description: >-
        Present on the parameterized lookup route when verbose=true and the
        environment offers the debug object. It is an integration aid the
        sandbox at `dev-epg-api.pixalate.com` offers, not a guarantee of every
        environment: an environment that does not offer it answers a verbose
        request with the ordinary envelope and no debug object, and with no
        notice, reason code, or error to say so. Identifier-level disclosures
        (supersession, ignored-empty, unsupported, conflicts) live here and only
        here. Use it during integration: it shows exactly how each input was
        read.
      properties:
        interpreted:
          type: object
          description: >-
            The request as understood: the platform it resolved against, and the
            parsed timestamp.
          additionalProperties: true
        inputs:
          type: object
          description: >-
            Verdict map for the evidence-bearing inputs, keyed by request field
            name: channelId, channelName and title. These are the inputs whose
            contribution to the result is otherwise invisible. The context
            inputs — bundle, os and timestamp — carry no verdict because they
            are not matched against anything; how they were read is reported
            under `interpreted`.
          additionalProperties:
            type: object
            properties:
              verdict:
                type: string
                enum:
                  - MATCHED
                  - UNMATCHED
                  - IGNORED_EMPTY
                  - IGNORED_SUPERSEDED
                  - UNSUPPORTED
                  - CONFLICT
                example: MATCHED
              hint:
                type: string
                description: >-
                  Optional diagnostic — for example, a value that appears to
                  belong in a different field.
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: >-
            Machine-readable error code. A code names a product condition the
            HTTP status cannot express; where there is no such distinction the
            code is the status name, so branch on the status first and on the
            code only for the values below. RATE_LIMITED is a 429 from a
            request-rate ceiling and clears within the window. BATCH_TOO_LARGE
            means the batch exceeded the documented item cap — split and retry.
            TIMESTAMP_OUT_OF_WINDOW means the instant requested lies outside the
            7-day coverage window or more than 5 minutes in the future.
          enum:
            - BAD_REQUEST
            - BATCH_TOO_LARGE
            - TIMESTAMP_OUT_OF_WINDOW
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - PAYLOAD_TOO_LARGE
            - RATE_LIMITED
            - SERVICE_UNAVAILABLE
          example: BAD_REQUEST
        message:
          type: string
          example: bundle is required.
